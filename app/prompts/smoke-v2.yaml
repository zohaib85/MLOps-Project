# Fixed, synthetic regression prompt set. NEVER edit in place — copy to a new version.
# v2 vs v1: same prompts; gate on aggregate pass rate instead of every prompt.
#   Why: answer quality is statistical. One knowledge miss must not block a release;
#   a drop in pass rate should. Serving-path correctness is gated separately (strict).
# Known limitation (Qwen2.5-0.5B @ 7ae5576): `domain` answers "Docker" — kept on purpose
#   as a baseline signal; a larger model should fix it.
version: smoke-v2
max_tokens: 48
min_pass_rate: 0.8
prompts:
  - id: capital
    content: "What is the capital of France? Answer with one word."
    expect_any: ["paris"]
  - id: arithmetic
    content: "What is 12 + 30? Answer with just the number."
    expect_any: ["42"]
  - id: domain
    content: "Which open-source system orchestrates containers and was originally designed at Google? One word."
    expect_any: ["kubernetes", "k8s"]
  - id: translation
    content: "Translate the English word 'hello' into Spanish. One word."
    expect_any: ["hola"]
  - id: format
    content: 'Reply with only this JSON and nothing else: {"status": "ok"}'
    expect_any: ['"status"']
