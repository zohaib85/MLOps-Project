# NVIDIA device plugin — advertises `nvidia.com/gpu` to the kubelet so pods can request GPUs.
# Based on the AKS docs manifest (use-nvidia-gpu), plus a nodeSelector so it only runs on
# GPU nodes. AKS installs the GPU *driver* on the node image; this plugin is the K8s bridge.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-resources
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: gpu-resources
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        workload: gpu            # set on the GPU node pool (--labels workload=gpu)
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule     # matches the GPU pool taint (--node-taints sku=gpu:NoSchedule)
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
