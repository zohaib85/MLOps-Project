# kube-prometheus-stack (chart 92.2.0) — Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics, node-exporter. Sized for the lab: one Standard_D2s_v4 system node (2 vCPU / 8 GiB)
# shared with Argo CD. Install: `make monitoring-install` (release `kps`, namespace `monitoring`).
fullnameOverride: kps # short names: svc/kps-prometheus, svc/kps-alertmanager (Grafana: svc/kps-grafana)

# AKS runs etcd, the scheduler, controller-manager and kube-proxy (Cilium dataplane) out of reach —
# scraping them only produces permanent TargetDown alerts. Same rule-groups off accordingly.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PrometheusRules from every namespace, not only ones labelled with
    # this Helm release. Our chart's objects live in `llm`; dcgm-exporter's in `monitoring`.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Disposable lab: no PVC (emptyDir). Data survives pod restarts on the same node only.
    # Evidence (screenshots, benchmark JSON) is exported during the session, not kept here.
    retention: 2d
    retentionSize: 3GB
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 1536Mi }

alertmanager:
  alertmanagerSpec:
    retention: 24h
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  # No receivers configured: alerts are visible in the Alertmanager/Prometheus UIs (enough for
  # drills). A Slack/e-mail receiver is a one-block addition under alertmanager.config.

grafana:
  # Admin password: generated by the chart into secret kps-grafana (`make grafana-password`).
  defaultDashboardsEnabled: true # Kubernetes / node dashboards — useful while learning
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard # our chart ships its dashboard as a ConfigMap with this label
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  # Default tolerations (NoSchedule: Exists) already put it on the tainted GPU node too.
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }
