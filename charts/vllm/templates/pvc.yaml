{{- if and .Values.modelCache.enabled (not .Values.modelCache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vllm.cacheClaimName" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
  {{- if .Values.modelCache.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.modelCache.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
